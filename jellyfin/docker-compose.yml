services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "${USER_ID}:${USER_ID}"
    ports:
      - 0.0.0.0:8096:8096/tcp
      - 0.0.0.0:7359:7359/udp
    volumes:
      - type: bind
        source: ${CONFIG_SOURCE}
        target: /config
      - type: bind
        source: ${CACHE_SOURCE}
        target: /cache
      - type: bind
        source: ${MEDIA_SOURCE}
        target: /media
      - type: bind
        source: ${FONTS_SOURCE}
        target: /fonts
    restart: 'unless-stopped'
